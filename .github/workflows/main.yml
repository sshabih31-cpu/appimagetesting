name: Build AppImage Maker Tool

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo (for optional icon)
        uses: actions/checkout@v4

      - name: Download runtimes & appimagetool
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Download appimagetool
          gh release download continuous --repo AppImage/appimagetool --pattern "*x86_64.AppImage" --output appimagetool.AppImage
          chmod +x appimagetool.AppImage

          # Download LÖVE 11.5 AppImage for .love packaging
          gh release download 11.5 --repo love2d/love --pattern "*x86_64.AppImage" --output love.AppImage
          chmod +x love.AppImage

          # Download latest nightly Ruffle Linux x86_64 build for .swf packaging
          RUFFLE_TAG=$(gh release list --repo ruffle-rs/ruffle --limit 1 --json tagName --jq '.[0].tagName')
          gh release download "$RUFFLE_TAG" --repo ruffle-rs/ruffle --pattern "*linux-x86_64.tar.gz" --output ruffle.tar.gz

      - name: Assemble AppImage Maker AppDir
        run: |
          sudo apt-get update && sudo apt-get install -y python3-pil python3-venv python3-tk
          mkdir -p AppDir/opt/runtimes/love AppDir/opt/runtimes/ruffle

          # Create bundled Python environment with Pillow inside the tool
          python3 -m venv --copies AppDir/opt/venv
          AppDir/opt/venv/bin/pip install --upgrade pip
          AppDir/opt/venv/bin/pip install pillow

          # Bundle appimagetool
          cp appimagetool.AppImage AppDir/opt/runtimes/appimagetool.AppImage
          chmod +x AppDir/opt/runtimes/appimagetool.AppImage

          # Extract LÖVE runtime into AppDir so .love builds need no extra runtime download
          ./love.AppImage --appimage-extract
          cp -r squashfs-root/* AppDir/opt/runtimes/love/
          rm -rf squashfs-root

          # Extract Ruffle binary into AppDir so .swf builds need no extra runtime download
          mkdir -p tmp_ruffle
          tar -xzf ruffle.tar.gz -C tmp_ruffle
          RUFFLE_BIN=$(find tmp_ruffle -name "ruffle" -type f | head -n 1)
          cp "$RUFFLE_BIN" AppDir/opt/runtimes/ruffle/ruffle
          chmod +x AppDir/opt/runtimes/ruffle/ruffle
          rm -rf tmp_ruffle

          # Write the GUI AppImage Maker application
          cat << 'EOF' > AppDir/opt/maker.py
          import os
          import re
          import shlex
          import shutil
          import subprocess
          import sys
          import tempfile
          import threading
          import tkinter as tk
          import urllib.request
          import zipfile
          from tkinter import filedialog, messagebox, ttk
          from PIL import Image, ImageDraw


          SUPPORTED_EXTS = [".p8.png", ".py", ".swf", ".html", ".love", ".p8", ".zip", ".sh"]


          def slugify_name(name):
              cleaned = re.sub(r"[^A-Za-z0-9._-]+", "-", name.strip())
              cleaned = cleaned.strip("-")
              return cleaned or "CustomApp"


          def detect_ext(name_or_url):
              lower = name_or_url.split("?")[0].split("#")[0].lower()
              for ext in SUPPORTED_EXTS:
                  if lower.endswith(ext):
                      return ext
              return ""


          def prepare_icon(icon_path, out_png):
              if icon_path and os.path.isfile(icon_path):
                  img = Image.open(icon_path).convert("RGBA")
                  if img.size != (256, 256):
                      img = img.resize((256, 256), Image.NEAREST)
                  img.save(out_png)
              else:
                  img = Image.new("RGBA", (256, 256), (32, 42, 64, 255))
                  draw = ImageDraw.Draw(img)
                  draw.rounded_rectangle([28, 28, 228, 228], radius=32, fill=(79, 140, 255, 255))
                  draw.polygon([(128, 66), (186, 166), (70, 166)], fill=(255, 255, 255, 255))
                  img.save(out_png)


          def write_desktop_and_icon(app_dir, app_name, icon_src_png):
              shutil.copy2(icon_src_png, os.path.join(app_dir, "appicon.png"))
              dir_icon = os.path.join(app_dir, ".DirIcon")
              if os.path.lexists(dir_icon):
                  os.unlink(dir_icon)
              os.symlink("appicon.png", dir_icon)

              desktop_content = (
                  "[Desktop Entry]\n"
                  "Type=Application\n"
                  f"Name={app_name}\n"
                  "Exec=AppRun\n"
                  "Icon=appicon\n"
                  "Categories=Game;Utility;\n"
              )
              with open(os.path.join(app_dir, "customapp.desktop"), "w", encoding="utf-8") as f:
                  f.write(desktop_content)


          def build_appimage_payload(
              app_name,
              ext,
              payload_path,
              icon_path,
              output_appimage,
              runtimes_dir,
              pip_packages_str,
              log_fn,
          ):
              slug = slugify_name(app_name)
              with tempfile.TemporaryDirectory(prefix="appimg_build_") as tmp:
                  app_dir = os.path.join(tmp, "AppDir")
                  os.makedirs(os.path.join(app_dir, "opt"), exist_ok=True)
                  icon_256 = os.path.join(tmp, "icon_256.png")
                  prepare_icon(icon_path, icon_256)
                  write_desktop_and_icon(app_dir, app_name, icon_256)

                  apprun_path = os.path.join(app_dir, "AppRun")

                  if ext == ".love":
                      log_fn("Fusing LÖVE runtime with .love archive...")
                      shutil.copytree(os.path.join(runtimes_dir, "love"), app_dir, dirs_exist_ok=True)
                      love_bin = os.path.join(app_dir, "bin", "love")
                      fused_bin = os.path.join(app_dir, "bin", slug)
                      with open(fused_bin, "wb") as out_f:
                          with open(love_bin, "rb") as b_f:
                              shutil.copyfileobj(b_f, out_f)
                          with open(payload_path, "rb") as p_f:
                              shutil.copyfileobj(p_f, out_f)
                      os.chmod(fused_bin, 0o755)
                      if os.path.exists(love_bin):
                          os.remove(love_bin)
                      with open(apprun_path, "w", encoding="utf-8") as f:
                          f.write(
                              "#!/bin/sh\n"
                              'HERE="$(dirname "$(readlink -f "${0}")")"\n'
                              f'exec "$HERE/bin/{slug}" "$@"\n'
                          )

                  elif ext == ".swf":
                      log_fn("Bundling Ruffle runtime and SWF...")
                      ruffle_dst = os.path.join(app_dir, "opt", "ruffle")
                      os.makedirs(ruffle_dst, exist_ok=True)
                      shutil.copy2(os.path.join(runtimes_dir, "ruffle", "ruffle"), os.path.join(ruffle_dst, "ruffle"))
                      os.chmod(os.path.join(ruffle_dst, "ruffle"), 0o755)
                      shutil.copy2(payload_path, os.path.join(ruffle_dst, "game.swf"))
                      with open(apprun_path, "w", encoding="utf-8") as f:
                          f.write(
                              "#!/bin/sh\n"
                              'HERE="$(dirname "$(readlink -f "${0}")")"\n'
                              'exec "$HERE/opt/ruffle/ruffle" "$HERE/opt/ruffle/game.swf" "$@"\n'
                          )

                  elif ext == ".py":
                      shutil.copy2(payload_path, os.path.join(app_dir, "opt", "script.py"))
                      pkgs = shlex.split(pip_packages_str.strip()) if pip_packages_str.strip() else []
                      if pkgs:
                          log_fn(f"Creating venv and installing pip packages: {', '.join(pkgs)}...")
                          venv_dir = os.path.join(app_dir, "opt", "venv")
                          subprocess.run([sys.executable, "-m", "venv", "--copies", venv_dir], check=True)
                          venv_pip = os.path.join(venv_dir, "bin", "pip")
                          subprocess.run([venv_pip, "install", *pkgs], check=True)
                          with open(apprun_path, "w", encoding="utf-8") as f:
                              f.write(
                                  "#!/bin/sh\n"
                                  'HERE="$(dirname "$(readlink -f "${0}")")"\n'
                                  'exec "$HERE/opt/venv/bin/python" "$HERE/opt/script.py" "$@"\n'
                              )
                      else:
                          log_fn("Bundling Python script into AppDir...")
                          with open(apprun_path, "w", encoding="utf-8") as f:
                              f.write(
                                  "#!/bin/sh\n"
                                  'HERE="$(dirname "$(readlink -f "${0}")")"\n'
                                  'exec python3 "$HERE/opt/script.py" "$@"\n'
                              )

                  elif ext == ".html":
                      log_fn("Bundling HTML app with local launcher...")
                      web_dir = os.path.join(app_dir, "opt", "web")
                      os.makedirs(web_dir, exist_ok=True)
                      shutil.copy2(payload_path, os.path.join(web_dir, "index.html"))
                      runner_py = os.path.join(app_dir, "opt", "serve_html.py")
                      with open(runner_py, "w", encoding="utf-8") as f:
                          f.write(
                              "import functools, http.server, os, socketserver, webbrowser\n"
                              "web_dir = os.path.join(os.path.dirname(os.path.abspath(__file__)), 'web')\n"
                              "handler = functools.partial(http.server.SimpleHTTPRequestHandler, directory=web_dir)\n"
                              "with socketserver.TCPServer(('127.0.0.1', 0), handler) as httpd:\n"
                              "    port = httpd.server_address[1]\n"
                              "    webbrowser.open(f'http://127.0.0.1:{port}/index.html')\n"
                              "    try:\n"
                              "        httpd.serve_forever()\n"
                              "    except KeyboardInterrupt:\n"
                              "        pass\n"
                          )
                      with open(apprun_path, "w", encoding="utf-8") as f:
                          f.write(
                              "#!/bin/sh\n"
                              'HERE="$(dirname "$(readlink -f "${0}")")"\n'
                              'exec python3 "$HERE/opt/serve_html.py" "$@"\n'
                          )

                  elif ext in (".p8", ".p8.png"):
                      log_fn("Bundling PICO-8 cartridge into AppDir...")
                      cart_name = "cart.p8.png" if ext == ".p8.png" else "cart.p8"
                      shutil.copy2(payload_path, os.path.join(app_dir, "opt", cart_name))
                      with open(apprun_path, "w", encoding="utf-8") as f:
                          f.write(
                              "#!/bin/sh\n"
                              'HERE="$(dirname "$(readlink -f "${0}")")"\n'
                              'if command -v pico8 >/dev/null 2>&1; then\n'
                              f'  exec pico8 -run "$HERE/opt/{cart_name}" "$@"\n'
                              "else\n"
                              '  echo "pico8 binary not found in PATH." >&2\n'
                              "  exit 1\n"
                              "fi\n"
                          )

                  elif ext == ".sh":
                      log_fn("Bundling shell script into AppDir...")
                      shutil.copy2(payload_path, os.path.join(app_dir, "opt", "run.sh"))
                      os.chmod(os.path.join(app_dir, "opt", "run.sh"), 0o755)
                      with open(apprun_path, "w", encoding="utf-8") as f:
                          f.write(
                              "#!/bin/sh\n"
                              'HERE="$(dirname "$(readlink -f "${0}")")"\n'
                              'exec sh "$HERE/opt/run.sh" "$@"\n'
                          )

                  elif ext == ".zip":
                      log_fn("Extracting .zip bundle into AppDir...")
                      extract_dir = os.path.join(app_dir, "opt", "bundle")
                      os.makedirs(extract_dir, exist_ok=True)
                      with zipfile.ZipFile(payload_path, "r") as zf:
                          zf.extractall(extract_dir)
                      with open(apprun_path, "w", encoding="utf-8") as f:
                          f.write(
                              "#!/bin/sh\n"
                              'HERE="$(dirname "$(readlink -f "${0}")")"\n'
                              'BUNDLE="$HERE/opt/bundle"\n'
                              'if [ -f "$BUNDLE/AppRun" ]; then chmod +x "$BUNDLE/AppRun"; exec "$BUNDLE/AppRun" "$@"; fi\n'
                              'if [ -f "$BUNDLE/index.html" ]; then exec xdg-open "$BUNDLE/index.html"; fi\n'
                              'if [ -f "$BUNDLE/main.py" ]; then exec python3 "$BUNDLE/main.py" "$@"; fi\n'
                              'echo "Extracted bundle to $BUNDLE" >&2\n'
                          )

                  os.chmod(apprun_path, 0o755)

                  appimagetool_bin = os.path.join(runtimes_dir, "appimagetool.AppImage")
                  log_fn("Packaging .AppImage with appimagetool...")
                  env = os.environ.copy()
                  env["ARCH"] = "x86_64"
                  res = subprocess.run(
                      [appimagetool_bin, "--appimage-extract-and-run", app_dir, output_appimage],
                      env=env,
                      capture_output=True,
                      text=True,
                  )
                  if res.returncode != 0:
                      raise RuntimeError(res.stderr or res.stdout or "appimagetool failed")
                  os.chmod(output_appimage, 0o755)


          def download_url_to_file(url, dest_path):
              req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"})
              with urllib.request.urlopen(req, timeout=60) as resp, open(dest_path, "wb") as out:
                  shutil.copyfileobj(resp, out)


          def main():
              script_dir = os.path.dirname(os.path.abspath(__file__))
              runtimes_dir = os.path.join(script_dir, "runtimes")

              root = tk.Tk()
              root.title("AppImage Maker (Linux x86_64)")
              root.geometry("470x520")

              pad = {"padx": 14, "pady": 5}

              ttk.Label(root, text="App Name:").pack(anchor="w", **pad)
              name_var = tk.StringVar()
              ttk.Entry(root, textvariable=name_var).pack(fill="x", padx=14)

              mode_var = tk.StringVar(value="file")
              mode_frame = ttk.Frame(root)
              mode_frame.pack(fill="x", padx=14, pady=(10, 4))
              ttk.Radiobutton(mode_frame, text="Local File", variable=mode_var, value="file").pack(side="left", padx=(0, 14))
              ttk.Radiobutton(mode_frame, text="Direct Link", variable=mode_var, value="url").pack(side="left")

              src_var = tk.StringVar()
              src_row = ttk.Frame(root)
              src_row.pack(fill="x", padx=14)
              src_entry = ttk.Entry(src_row, textvariable=src_var)
              src_entry.pack(side="left", fill="x", expand=True)

              def pick_source():
                  path = filedialog.askopenfilename(
                      title="Select Source File",
                      filetypes=[("Supported Files", "*.py *.swf *.html *.love *.p8 *.png *.zip *.sh"), ("All Files", "*.*")],
                  )
                  if path:
                      src_var.set(path)

              ttk.Button(src_row, text="Browse", command=pick_source).pack(side="left", padx=(6, 0))

              ttk.Label(root, text="Extra pip Packages (for .py files, space-separated):").pack(anchor="w", padx=14, pady=(10, 4))
              pip_var = tk.StringVar()
              ttk.Entry(root, textvariable=pip_var).pack(fill="x", padx=14)

              icon_var = tk.StringVar()
              ttk.Label(root, text="PNG Icon (Optional, resized 256x256 Nearest Neighbor):").pack(anchor="w", padx=14, pady=(10, 4))
              icon_row = ttk.Frame(root)
              icon_row.pack(fill="x", padx=14)
              ttk.Entry(icon_row, textvariable=icon_var).pack(side="left", fill="x", expand=True)

              def pick_icon():
                  path = filedialog.askopenfilename(title="Select PNG Icon", filetypes=[("PNG Image", "*.png")])
                  if path:
                      icon_var.set(path)

              ttk.Button(icon_row, text="Browse", command=pick_icon).pack(side="left", padx=(6, 0))

              status_var = tk.StringVar(value="Ready.")
              ttk.Label(root, textvariable=status_var, wraplength=430).pack(anchor="w", padx=14, pady=(12, 6))

              build_btn = ttk.Button(root, text="Build & Save .AppImage")
              build_btn.pack(pady=8)

              def start_build():
                  app_name = name_var.get().strip()
                  src_val = src_var.get().strip()
                  icon_val = icon_var.get().strip()
                  pip_val = pip_var.get().strip()
                  mode = mode_var.get()

                  if not app_name:
                      messagebox.showwarning("Missing Name", "Please enter an App Name.")
                      return
                  if not src_val:
                      messagebox.showwarning("Missing Source", "Please choose a file or enter a URL.")
                      return

                  ext = detect_ext(src_val)
                  if not ext:
                      messagebox.showerror("Unsupported Type", f"Unsupported format. Allowed: {', '.join(SUPPORTED_EXTS)}")
                      return

                  default_out = f"{slugify_name(app_name)}-x86_64.AppImage"
                  out_path = filedialog.asksaveasfilename(
                      title="Save Generated AppImage",
                      initialfile=default_out,
                      defaultextension=".AppImage",
                      filetypes=[("AppImage", "*.AppImage")],
                  )
                  if not out_path:
                      return

                  build_btn.state(["disabled"])

                  def worker():
                      try:
                          if mode == "file":
                              if not os.path.isfile(src_val):
                                  raise FileNotFoundError(f"File not found: {src_val}")
                              build_appimage_payload(
                                  app_name, ext, src_val, icon_val or None, out_path, runtimes_dir, pip_val,
                                  lambda msg: root.after(0, status_var.set, msg),
                              )
                          else:
                              with tempfile.TemporaryDirectory(prefix="dl_") as dl_tmp:
                                  dl_file = os.path.join(dl_tmp, "input" + ext)
                                  root.after(0, status_var.set, "Downloading source URL...")
                                  download_url_to_file(src_val, dl_file)
                                  build_appimage_payload(
                                      app_name, ext, dl_file, icon_val or None, out_path, runtimes_dir, pip_val,
                                      lambda msg: root.after(0, status_var.set, msg),
                                  )
                          root.after(0, status_var.set, f"Done! Saved: {out_path}")
                          root.after(0, messagebox.showinfo, "Success", f"Created:\n{out_path}")
                      except Exception as exc:
                          root.after(0, status_var.set, f"Error: {exc}")
                          root.after(0, messagebox.showerror, "Build Failed", str(exc))
                      finally:
                          root.after(0, lambda: build_btn.state(["!disabled"]))

                  threading.Thread(target=worker, daemon=True).start()

              build_btn.configure(command=start_build)
              root.mainloop()


          if __name__ == "__main__":
              main()
          EOF

          # Optional repo icon for the maker tool itself (falls back to generated icon if none in repo)
          ICON_FILE=$(ls *.png 2>/dev/null | head -n 1 || true)
          python3 -c "
          from PIL import Image, ImageDraw
          icon_path = '$ICON_FILE'
          if icon_path:
              img = Image.open(icon_path).convert('RGBA')
              if img.size != (256, 256):
                  img = img.resize((256, 256), Image.NEAREST)
          else:
              img = Image.new('RGBA', (256, 256), (32, 42, 64, 255))
              d = ImageDraw.Draw(img)
              d.rounded_rectangle([24, 24, 232, 232], radius=36, fill=(79, 140, 255, 255))
              d.text((64, 108), 'APPIMG', fill=(255, 255, 255, 255))
          img.save('AppDir/maker.png')
          "
          ln -s maker.png AppDir/.DirIcon

          cat << 'EOF' > AppDir/maker.desktop
          [Desktop Entry]
          Type=Application
          Name=AppImage Maker
          Exec=AppRun
          Icon=maker
          Terminal=false
          Categories=Utility;Development;
          EOF

          cat << 'EOF' > AppDir/AppRun
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "${0}")")"
          export PATH="$HERE/opt/venv/bin:$PATH"
          exec python3 "$HERE/opt/maker.py" "$@"
          EOF
          chmod +x AppDir/AppRun

      - name: Package AppImage Maker
        run: |
          ARCH=x86_64 ./appimagetool.AppImage --appimage-extract-and-run AppDir AppImage-Maker-x86_64.AppImage

      - name: Upload AppImage Maker Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AppImage-Maker-Linux-AppImage
          path: AppImage-Maker-x86_64.AppImage
