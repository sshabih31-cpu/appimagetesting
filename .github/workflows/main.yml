name: Build FreeGames AppImage

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo (for launcher.py and icon)
        uses: actions/checkout@v4

      - name: Download appimagetool
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download continuous --repo AppImage/appimagetool --pattern "*x86_64.AppImage" --output appimagetool.AppImage
          chmod +x appimagetool.AppImage

      - name: Build AppDir (Python venv + freegames + Icon)
        run: |
          sudo apt-get update && sudo apt-get install -y python3-pil python3-venv python3-tk
          mkdir -p AppDir/opt

          # Create isolated virtual environment inside AppDir and install freegames
          python3 -m venv --copies AppDir/opt/venv
          AppDir/opt/venv/bin/pip install --upgrade pip
          AppDir/opt/venv/bin/pip install freegames

          # Copy launcher script
          cp launcher.py AppDir/opt/launcher.py

          # Resize and install 256x256 icon
          ICON_FILE=$(ls *.png | head -n 1)
          python3 -c "
          from PIL import Image
          img = Image.open('$ICON_FILE').convert('RGBA')
          if img.size != (256, 256):
              img = img.resize((256, 256), Image.NEAREST)
          img.save('AppDir/freegames.png')
          "
          ln -s freegames.png AppDir/.DirIcon

          # Create .desktop entry
          cat << 'EOF' > AppDir/freegames.desktop
          [Desktop Entry]
          Type=Application
          Name=FreeGames Launcher
          Exec=AppRun
          Icon=freegames
          Terminal=true
          Categories=Game;
          EOF

          # Create AppRun using bundled venv Python
          cat << 'EOF' > AppDir/AppRun
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "${0}")")"
          exec "$HERE/opt/venv/bin/python" "$HERE/opt/launcher.py" "$@"
          EOF
          chmod +x AppDir/AppRun

      - name: Package AppImage
        run: |
          ARCH=x86_64 ./appimagetool.AppImage --appimage-extract-and-run AppDir FreeGames-Launcher-x86_64.AppImage

      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: FreeGames-Launcher-Linux-AppImage
          path: FreeGames-Launcher-x86_64.AppImage
