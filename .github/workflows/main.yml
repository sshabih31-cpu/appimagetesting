name: Build CelLua AppImage

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo (for your icon)
        uses: actions/checkout@v4

      - name: Download CelLua v2.0.2, LÖVE & appimagetool
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -fL -A "Mozilla/5.0" "https://archive.org" -o CelLua.love
          gh release download 11.5 --repo love2d/love --pattern "*x86_64.AppImage" --output love.AppImage
          gh release download continuous --repo AppImage/appimagetool --pattern "*x86_64.AppImage" --output appimagetool.AppImage
          chmod +x love.AppImage appimagetool.AppImage

      - name: Fuse CelLua & Apply Repo Icon
        run: |
          sudo apt-get update && sudo apt-get install -y python3-pil
          ./love.AppImage --appimage-extract
          cat squashfs-root/bin/love CelLua.love > squashfs-root/bin/CelLua
          chmod +x squashfs-root/bin/CelLua
          rm -f squashfs-root/bin/love

          ICON_FILE=$(ls *.png | head -n 1)
          python3 -c "
          from PIL import Image
          img = Image.open('$ICON_FILE')
          if img.size != (256, 256):
              img = img.resize((256, 256), Image.NEAREST)
          img.save('squashfs-root/cellua.png')
          "
          rm -f squashfs-root/love.svg squashfs-root/.DirIcon
          ln -s cellua.png squashfs-root/.DirIcon

          mv squashfs-root/love.desktop squashfs-root/cellua.desktop
          sed -i 's/Exec=love %f/Exec=CelLua %f/g' squashfs-root/cellua.desktop
          sed -i 's/Name=LÖVE/Name=CelLua Machine/g' squashfs-root/cellua.desktop
          sed -i 's/Icon=love/Icon=cellua/g' squashfs-root/cellua.desktop

          printf '#!/bin/sh\nHERE="$(dirname "$(readlink -f "${0}")")"\nexec "$HERE/bin/CelLua" "$@"\n' > squashfs-root/AppRun
          chmod +x squashfs-root/AppRun

      - name: Package AppImage
        run: |
          ARCH=x86_64 ./appimagetool.AppImage --appimage-extract-and-run squashfs-root CelLua-v2.0.2-x86_64.AppImage

      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: CelLua-v2.0.2-Linux-AppImage
          path: CelLua-v2.0.2-x86_64.AppImage
